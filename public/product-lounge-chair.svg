<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F5"/>
      <stop offset="1" stop-color="#EDE5D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="60" y1="500" x2="740" y2="500" stroke="#D4CEC6" stroke-width="1"/>
  <g stroke="#2A2620" stroke-width="2.5">
    <!-- Seat -->
    <path d="M 180 400 L 560 420 L 600 330 L 210 310 Z" fill="#C4713A"/>
    <!-- Backrest angled -->
    <path d="M 560 420 Q 680 400 720 250 Q 710 200 660 200 Q 620 210 600 330" fill="#C4713A"/>
    <!-- Arm front -->
    <path d="M 210 310 L 180 400 L 220 400 L 240 330 Z" fill="#A85D28"/>
  </g>
  <g stroke="#2A2620" stroke-width="2.5" fill="none">
    <!-- Legs -->
    <line x1="200" y1="400" x2="190" y2="500"/>
    <line x1="240" y1="420" x2="250" y2="500"/>
    <line x1="540" y1="420" x2="560" y2="500"/>
    <line x1="580" y1="420" x2="620" y2="500"/>
  </g>
  <g stroke="#2A2620" stroke-width="1" opacity="0.25" fill="none">
    <path d="M 230 360 Q 330 350 430 360 Q 530 370 580 370"/>
  </g>
  <!-- Pillow -->
  <rect x="400" y="340" width="120" height="70" rx="10" fill="#FAF8F5" stroke="#2A2620" stroke-width="2" transform="rotate(-8 460 375)"/>
</svg>
