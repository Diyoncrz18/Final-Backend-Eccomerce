<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F5"/>
      <stop offset="1" stop-color="#EDE5D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="60" y1="500" x2="740" y2="500" stroke="#D4CEC6" stroke-width="1"/>
  <!-- Long side -->
  <g stroke="#2A2620" stroke-width="2.5">
    <rect x="90" y="330" width="540" height="120" rx="12" fill="#C4713A"/>
    <rect x="90" y="240" width="80" height="210" rx="12" fill="#C4713A"/>
    <rect x="570" y="240" width="80" height="210" rx="12" fill="#C4713A"/>
    <!-- Chaise extension -->
    <rect x="630" y="330" width="140" height="120" rx="12" fill="#A85D28"/>
    <!-- Back cushions -->
    <rect x="180" y="250" width="180" height="100" rx="10" fill="#A85D28"/>
    <rect x="380" y="250" width="180" height="100" rx="10" fill="#A85D28"/>
  </g>
  <g stroke="#2A2620" stroke-width="2.5" fill="none">
    <line x1="110" y1="450" x2="115" y2="500"/>
    <line x1="160" y1="450" x2="165" y2="500"/>
    <line x1="600" y1="450" x2="605" y2="500"/>
    <line x1="650" y1="450" x2="650" y2="500"/>
    <line x1="740" y1="450" x2="730" y2="500"/>
  </g>
  <g fill="#FAF8F5" stroke="#2A2620" stroke-width="2">
    <rect x="640" y="360" width="90" height="70" rx="10" transform="rotate(-4 685 395)"/>
  </g>
</svg>
